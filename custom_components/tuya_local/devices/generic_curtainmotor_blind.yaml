name: Blind motor
products:
  - id: f4jrc6yn2pfqhnco
    model: Intelligent curtain motor
entities:
  - entity: cover
    class: blind
    dps:
      - id: 1
        name: control
        type: string
        mapping:
          - dps_val: open
            value: open
          - dps_val: close
            value: close
          - dps_val: stop
            value: stop
      # The cloud model lists position dps 2 and 3, but locally the motor
      # never reports them. dp 7 keeps the direction of the last move after
      # stopping, so it is the only feedback available for open/closed.
      - id: 7
        name: open
        type: string
        mapping:
          - dps_val: opening
            value: true
          - dps_val: closing
            value: false
  - entity: switch
    name: Reverse
    category: config
    icon: "mdi:arrow-u-down-left"
    dps:
      - id: 5
        type: string
        name: switch
        mapping:
          - dps_val: back
            value: true
          - dps_val: forward
            value: false
  - entity: number
    name: Travel time
    category: config
    icon: "mdi:timer-outline"
    dps:
      - id: 10
        type: integer
        name: value
        unit: ms
        range:
          min: 0
          max: 120000
  - entity: binary_sensor
    class: problem
    category: diagnostic
    dps:
      - id: 12
        type: bitfield
        name: sensor
        optional: true
        mapping:
          - dps_val: 0
            value: false
          - dps_val: null
            value: false
          - value: true
      - id: 12
        type: bitfield
        name: fault_code
        optional: true
